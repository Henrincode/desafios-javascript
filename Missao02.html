<script>
    // Limpa o console
    clear();

    // Operadores Aritméticos
    console.log("Adição: 10 + 5 =", 10 + 5)
    console.log("Subtração: 10 - 5 =", 10 - 5)
    console.log("Multiplicação: 10 * 5 =", 10 * 5)
    console.log("Divisão: 10 / 5 =", 10 / 5)
    console.log("Módulo: 10 % 3 =", 10 % 3)
    console.log("Exponenciação: 2 ** 3 =", 2 ** 3)

    // Operadores Relacionais
    console.log("10 == 10:", 10 == 10)
    console.log("10 != 5:", 10 != 5)
    console.log("10 > 5:", 10 > 5)
    console.log("10 < 5:", 10 < 5)
    console.log("10 >= 10:", 10 >= 10)
    console.log("10 <= 9:", 10 <= 9)

    // Precedência de operadores
    console.log("10 + 5 * 2 =", 10 + 5 * 2)
    console.log("(10 + 5) * 2 =", (10 + 5) * 2)
</script>
